<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Snake - Tablet Power</title>
    <style>
        body {
            background: #020617;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #38bdf8;
            font-family: 'Consolas', monospace;
            overflow: hidden;
            touch-action: none;
        }
        .mobile-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 95%;
            max-width: 400px;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 15px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .game-area { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 1 / 1;
        }
        canvas {
            background: #000;
            border: 2px solid #38bdf8;
            width: 100%;
            height: 100%;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
            border-radius: 8px;
        }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 10;
            text-align: center;
        }
        #overlay.hidden { display: none; }
        h2 { text-shadow: 0 0 10px #38bdf8; margin: 0; font-size: 24px; }
        p { color: #64748b; font-size: 14px; margin-top: 8px; }
    </style>
</head>
<body>

<div class="mobile-wrapper">
  <div class="hud">
    <div class="stat">SCORE: <span id="score">000</span></div>
    <div class="stat">BEST: <span id="highScore">000</span></div>
  </div>

  <div class="game-area">
    <canvas id="cyberCanvas"></canvas>
    <div id="overlay">
      <h2 id="title">CYBER SNAKE</h2>
      <p>BAŞLAMAK İÇİN EKRANI KAYDIRIN</p>
      <p style="font-size: 10px; margin-top: 20px; color: #38bdf8;">Purpleguy © 2026</p>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById("cyberCanvas");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");

canvas.width = 400;
canvas.height = 400;
const GRID = 20;

let snake, food, dx, dy, score, gameActive = false;
let speed = 130;
let highScore = localStorage.getItem("cyberSwipeBest") || 0;
document.getElementById("highScore").innerText = highScore.toString().padStart(3, '0');

function init() {
  snake = [{x: 200, y: 200}, {x: 180, y: 200}];
  dx = GRID; dy = 0; score = 0; speed = 130;
  document.getElementById("score").innerText = "000";
  spawnFood();
}

function spawnFood() {
  food = {
    x: Math.floor(Math.random() * (canvas.width / GRID)) * GRID,
    y: Math.floor(Math.random() * (canvas.height / GRID)) * GRID
  };
  if(snake.some(s => s.x === food.x && s.y === food.y)) spawnFood();
}

let touchStartX = 0;
let touchStartY = 0;

window.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
}, {passive: false});

window.addEventListener('touchend', e => {
    let touchEndX = e.changedTouches[0].screenX;
    let touchEndY = e.changedTouches[0].screenY;
    handleSwipe(touchStartX, touchStartY, touchEndX, touchEndY);
}, {passive: false});

function handleSwipe(startX, startY, endX, endY) {
    if (!gameActive) {
        init();
        gameActive = true;
        overlay.classList.add("hidden");
    }

    const diffX = endX - startX;
    const diffY = endY - startY;

    if (Math.abs(diffX) > Math.abs(diffY)) {
        if (Math.abs(diffX) < 30) return;
        if (diffX > 0 && dx === 0) { dx = GRID; dy = 0; }
        else if (diffX < 0 && dx === 0) { dx = -GRID; dy = 0; }
    } else {
        if (Math.abs(diffY) < 30) return;
        if (diffY > 0 && dy === 0) { dx = 0; dy = GRID; }
        else if (diffY < 0 && dy === 0) { dx = 0; dy = -GRID; }
    }
}

function update() {
  if (!gameActive) return;
  const head = {x: snake[0].x + dx, y: snake[0].y + dy};

  if (head.x < 0 || head.x >= 400 || head.y < 0 || head.y >= 400 || 
      snake.some(s => s.x === head.x && s.y === head.y)) {
    gameActive = false;
    overlay.classList.remove("hidden");
    document.getElementById("title").innerText = "SYSTEM FAILURE";
    if(score > highScore) {
        highScore = score;
        localStorage.setItem("cyberSwipeBest", highScore);
        document.getElementById("highScore").innerText = highScore.toString().padStart(3, "0");
    }
    return;
  }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    document.getElementById("score").innerText = score.toString().padStart(3, '0');
    if(speed > 60) speed -= 2;
    spawnFood();
  } else {
    snake.pop();
  }
}

function draw() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  ctx.strokeStyle = "#0f172a";
  for(let i=0; i<400; i+=20) {
    ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,400); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(400,i); ctx.stroke();
  }

  ctx.fillStyle = "#fff";
  ctx.shadowBlur = 10; ctx.shadowColor = "#38bdf8";
  ctx.fillRect(food.x+5, food.y+5, GRID-10, GRID-10);

  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? "#38bdf8" : "#0c4a6e";
    ctx.fillRect(s.x+1, s.y+1, GRID-2, GRID-2);
  });
  ctx.shadowBlur = 0;
}

function loop() { update(); draw(); setTimeout(loop, speed); }
init(); loop();
</script>

</body>
</html>
