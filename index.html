<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Snake - Tablet Power</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#38bdf8">
    
    <style>
        /* SİBER NEON TEMA */
        body {
            background: #000; margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; color: #38bdf8; font-family: 'Consolas', monospace;
            overflow: hidden; touch-action: none;
        }
        .mobile-wrapper { display: flex; flex-direction: column; align-items: center; width: 95%; max-width: 400px; }
        
        /* HUD (Skor, Para, Rekor) */
        .hud { 
            display: flex; justify-content: space-between; width: 100%; 
            margin-bottom: 10px; font-weight: bold; text-shadow: 0 0 5px #38bdf8;
            font-size: 12px;
        }
        .money-val { color: #fbbf24; text-shadow: 0 0 5px #fbbf24; }

        .game-area { position: relative; width: 100%; aspect-ratio: 1 / 1; }
        canvas { background: #000; border: 2px solid #38bdf8; width: 100%; height: 100%; border-radius: 8px; box-shadow: 0 0 20px rgba(56, 189, 248, 0.1); }
        
        /* MENÜ KATMANLARI */
        .menu-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 20; border-radius: 8px;
            text-align: center;
        }
        .hidden { display: none !important; }
        
        h2 { text-shadow: 0 0 15px #38bdf8; margin: 0 0 15px 0; font-size: 24px; }
        
        /* BUTONLAR */
        .btn {
            background: transparent; color: #38bdf8; border: 2px solid #38bdf8;
            padding: 10px 20px; margin: 5px; border-radius: 5px; font-weight: bold;
            cursor: pointer; width: 180px; text-align: center; font-family: inherit;
            transition: 0.2s; text-transform: uppercase;
        }
        .btn:active { background: #38bdf8; color: #000; box-shadow: 0 0 20px #38bdf8; }
        
        /* MARKET ÖZEL */
        .market-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
        .btn-small { padding: 8px; font-size: 10px; width: auto; min-width: 80px; }
        .active-opt { background: #38bdf8 !important; color: #000 !important; }

        .apk-link { color: #64748b; text-decoration: none; font-size: 10px; margin-top: 10px; border-bottom: 1px solid #64748b; }
        .signature { 
            font-size: 10px; margin-top: 20px; color: #38bdf8; opacity: 0.8; 
            cursor: pointer; user-select: none; transition: 0.3s;
        }
        .signature:hover { opacity: 1; text-shadow: 0 0 8px #38bdf8; }
    </style>
</head>
<body>

<div class="mobile-wrapper">
  <div class="hud">
    <div>SCORE: <span id="score">000</span></div>
    <div>CASH: $<span id="moneyDisplay" class="money-val">0</span></div>
    <div>BEST: <span id="highScore">000</span></div>
  </div>

  <div class="game-area">
    <canvas id="cyberCanvas"></canvas>

    <div id="mainMenu" class="menu-layer">
      <h2 id="menuTitle">CYBER SNAKE</h2>
      <button class="btn" onclick="startGame()">SİSTEMİ BAŞLAT</button>
      <button class="btn" onclick="showMarket()">SİBER MARKET</button>
      <button class="btn" onclick="showSettings()">AYARLAR</button>
      
      <a href="https://github.com/aftonpurpleguy560-byte/Cyber-Snake/releases/download/v1.0/137538_CyberSnake_sign.apk" class="apk-link">
        ANDROID APK İNDİR (v1.0)
      </a>
      
      <p class="signature" onclick="toggleGodMode()">Purpleguy © 2026 - tablet power</p>
    </div>

    <div id="marketMenu" class="menu-layer hidden">
      <h2>SİBER MARKET</h2>
      <p style="font-size: 12px; color: #fbbf24; margin-bottom: 10px;">BAKİYE: $<span id="marketMoney">0</span></p>
      
      <div class="market-grid">
        <button class="btn btn-small" onclick="buySkin('#38bdf8', 0)">STANDART MAVİ</button>
        <button class="btn btn-small" style="border-color: #fbbf24; color: #fbbf24;" onclick="buySkin('#fbbf24', 50)">GOLD ($50)</button>
        <button class="btn btn-small" style="border-color: #ef4444; color: #ef4444;" onclick="buySkin('#ef4444', 50)">RED NEON ($50)</button>
        <button class="btn btn-small" style="border-color: #22c55e; color: #22c55e;" onclick="buySkin('#22c55e', 50)">TOXIC GREEN ($50)</button>
        <button class="btn btn-small" style="border-color: #a855f7; color: #a855f7;" onclick="buySkin('#a855f7', 50)">PURPLE VOID ($50)</button>
      </div>
      
      <button class="btn" onclick="hideMarket()">MENÜYE DÖN</button>
    </div>

    <div id="settingsMenu" class="menu-layer hidden">
      <h2>SİSTEM AYARLARI</h2>
      <p style="font-size: 11px; color: #64748b;">HIZ SEVİYESİ</p>
      <div style="display: flex; gap: 5px; margin-bottom: 15px;">
        <button id="diff0" class="btn btn-small" onclick="setDiff(0)">KOLAY</button>
        <button id="diff1" class="btn btn-small active-opt" onclick="setDiff(1)">ORTA</button>
        <button id="diff2" class="btn btn-small" onclick="setDiff(2)">ZOR</button>
      </div>
      <button class="btn" onclick="hideSettings()">KAYDET VE ÇIK</button>
    </div>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
