<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Snake - Tablet Power</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="mobile-wrapper">
    <div class="hud">
        <div>SCORE: <span id="score">000</span></div>
        <div>CASH: $<span id="moneyDisplay" style="color: #fbbf24;">0</span></div>
        <div>BEST: <span id="highScore">000</span></div>
    </div>

    <div class="game-area">
        <canvas id="cyberCanvas"></canvas>
        
        <div id="mainMenu" class="menu-layer">
            <h2 id="menuTitle">CYBER SNAKE</h2>
            <button class="btn" onclick="startGame()">SİSTEMİ BAŞLAT</button>
            <button class="btn" onclick="showMarket()">SİBER MARKET</button>
            <button class="btn" onclick="showSettings()">AYARLAR</button>
            <p class="signature" onclick="toggleGodMode()">Purpleguy © 2026 - tablet power</p>
        </div>

        <div id="marketMenu" class="menu-layer hidden">
            <h2>SİBER MARKET</h2>
            <p style="color:#fbbf24; font-size: 14px;">BAKİYE: $<span id="marketMoney">0</span></p>
            <div class="market-grid">
                <button class="btn btn-small" onclick="buySkin('#38bdf8', 0)">MAVİ (0)</button>
                <button class="btn btn-small" style="border-color:#fbbf24" onclick="buySkin('#fbbf24', 50)">SARI (50)</button>
                <button class="btn btn-small" style="border-color:#ef4444" onclick="buySkin('#ef4444', 50)">KIRMIZI (50)</button>
                <button class="btn btn-small" style="border-color:#a855f7" onclick="buySkin('#a855f7', 50)">MOR (50)</button>
            </div>
            <button class="btn" onclick="hideMarket()">GERİ DÖN</button>
        </div>

        <div id="settingsMenu" class="menu-layer hidden">
            <h2>AYARLAR</h2>
            <button class="btn btn-small" onclick="setDiff(0)">KOLAY</button>
            <button class="btn btn-small" onclick="setDiff(1)">ORTA</button>
            <button class="btn btn-small" onclick="setDiff(2)">ZOR</button>
            <br><br>
            <button class="btn" onclick="hideSettings()">GERİ DÖN</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
